parameters:
    linux_x64: false
    linux_arm64: false
    windows_x64: false
    windows_x86: false
    windows_arm64: false
    android_arm64: false
    coreclr_r2r_interpreter: false

jobs:
  - ${{ if or(eq(parameters.linux_x64, true), eq(parameters.windows_x64, true), eq(parameters.windows_x86, true), eq(parameters.linux_arm64, true), eq(parameters.windows_arm64, true)) }}:
    # build coreclr and libraries
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/common/global-build-job.yml
        buildConfig: release
        platforms:
        - ${{ if eq(parameters.linux_x64, true) }}:
          - linux_x64
        - ${{ if eq(parameters.windows_x64, true) }}:
          - windows_x64
        - ${{ if eq(parameters.windows_x86, true) }}:
          - windows_x86
        - ${{ if eq(parameters.linux_arm64, true) }}:
          - linux_arm64
        - ${{ if eq(parameters.windows_arm64, true) }}:
          - windows_arm64
        jobParameters:
          nameSuffix: coreclr
          buildArgs: -s clr+libs+host+packs -c $(_BuildConfig)
          isOfficialBuild: false
          postBuildSteps:
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
              displayName: Build Assets
          - task: PythonScript@0
            displayName: Select packaged runtime (Windows)
            condition: and(succeeded(), eq(variables['osGroup'], 'windows'))
            inputs:
              scriptSource: filePath
              scriptPath: $(Build.SourcesDirectory)/eng/pipelines/performance/scripts/select_runtime_distribution.py
              arguments: >-
                --shipping-dir "$(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/Shipping"
                --os-group "$(osGroup)"
                --architecture "$(archType)"
          - task: PythonScript@0
            displayName: Select packaged runtime (Linux)
            condition: and(succeeded(), eq(variables['osGroup'], 'linux'))
            inputs:
              scriptSource: filePath
              scriptPath: $(Build.SourcesDirectory)/eng/pipelines/performance/scripts/select_runtime_distribution.py
              pythonInterpreter: /usr/bin/python3
              arguments: >-
                --shipping-dir "$(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/Shipping"
                --os-group "$(osGroup)"
                --architecture "$(archType)"
          - task: CopyFiles@2
            displayName: Stage packaged runtime
            inputs:
              SourceFolder: $(Build.SourcesDirectory)/artifacts/packages/$(_BuildConfig)/Shipping
              Contents: $(RuntimeDistributionFiles)
              TargetFolder: $(Build.ArtifactStagingDirectory)/RuntimeDistribution
              CleanTargetFolder: true
              preserveTimestamp: true
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.ArtifactStagingDirectory)/RuntimeDistribution
              includeRootFolder: false
              archiveType: zip
              archiveExtension: .zip
              artifactName: RuntimeDistribution_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
              displayName: Packaged Runtime

  - ${{ if eq(parameters.android_arm64, true) }}:
    # build CoreCLR Android scenarios
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/common/global-build-job.yml
        buildConfig: release
        runtimeFlavor: coreclr
        platforms:
        - android_arm64
        jobParameters:
          buildArgs: -s clr.runtime+clr.alljits+clr.corelib+clr.nativecorelib+clr.tools+clr.packages+libs -c $(_BuildConfig)
          nameSuffix: AndroidCoreCLR
          isOfficialBuild: false
          postBuildSteps:
            - template: /eng/pipelines/performance/templates/build-perf-sample-apps.yml
              parameters:
                runtimeType: coreclr

  - ${{ if eq(parameters.coreclr_r2r_interpreter, true) }}:
    # build coreclr with interpreter fallback for R2R composite benchmarks
    - template: /eng/pipelines/common/platform-matrix.yml
      parameters:
        jobTemplate: /eng/pipelines/common/global-build-job.yml
        buildConfig: release
        platforms:
        - linux_arm64
        jobParameters:
          nameSuffix: coreclr_r2r_interpreter
          buildArgs: -s clr+libs+packs -c $(_BuildConfig) -dynamiccodecompiled false
          isOfficialBuild: false
          postBuildSteps:
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr_r2r_interpreter
              displayName: Build Assets (R2R Interpreter)
